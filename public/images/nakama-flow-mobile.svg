<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1138" role="img" aria-labelledby="title desc">
<title id="title">Nakama 실행 흐름 — 모바일</title><desc id="desc">빌드된 공식 Nakama 이미지에 우리 코드와 설정을 추가해 PlayHub 이미지를 만듭니다. Docker가 이 이미지를 컨테이너로 실행하면 로컬 Nakama 서버가 됩니다. 서버는 API 7350과 콘솔 7351을 제공하며 PostgreSQL과 통신합니다. 계정과 점수는 별도 데이터 볼륨에 저장되어 컨테이너를 정지해도 유지됩니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#8792aa" stroke-width="1.5"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="16" y="24" font-size="13" fill="#6353d8" font-weight="700">01  이미지 만들기</text><rect x="16" y="44" width="328" height="135" rx="16" fill="#fff" stroke="#dce2ed"/><g transform="translate(35 63)" fill="none" stroke="#6353d8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="2" width="30" height="12" rx="3"/><rect x="1" y="19" width="30" height="12" rx="3"/><path d="M6 8h2m4 0h12 M6 25h2m4 0h12"/></g><text x="80" y="87" font-size="20" fill="#26324b" font-weight="700">공식 Nakama 이미지</text><text x="35" y="127" font-size="16" fill="#26324b" font-weight="500">이미 빌드된 서버를 가져와요</text><text x="35" y="154" font-size="14" fill="#647086" font-weight="500">heroiclabs/nakama:3.37.0</text><rect x="16" y="219" width="328" height="135" rx="16" fill="#fff" stroke="#dce2ed"/><g transform="translate(35 238)" fill="none" stroke="#6353d8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="m10 7-8 9 8 9 M22 7l8 9-8 9 M19 2l-6 28"/></g><text x="80" y="262" font-size="20" fill="#26324b" font-weight="700">우리 코드 + 설정</text><text x="35" y="302" font-size="16" fill="#26324b" font-weight="500">리더보드 생성 · 서버 설정</text><text x="35" y="329" font-size="14" fill="#647086" font-weight="500">TypeScript → JavaScript 빌드</text><rect x="16" y="394" width="328" height="135" rx="16" fill="#f5f2ff" stroke="#dce2ed"/><g transform="translate(35 413)" fill="none" stroke="#6353d8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M2 8 16 1 30 8 16 15Z M2 8v16l14 7 14-7V8 M16 15v16"/></g><text x="80" y="437" font-size="20" fill="#26324b" font-weight="700">PlayHub 이미지</text><text x="35" y="477" font-size="16" fill="#26324b" font-weight="500">Nakama + 우리 코드 + 설정</text><text x="35" y="504" font-size="14" fill="#647086" font-weight="500">실행할 파일을 담은 패키지</text><text x="170" y="207" font-size="25" fill="#8792aa" font-weight="500">+</text><path d="M180 358 L180 386" fill="none" stroke="#8792aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 532 L180 583" fill="none" stroke="#8792aa" stroke-width="2" marker-end="url(#arrow)"/><text x="196" y="561" font-size="13" fill="#6353d8" font-weight="700">Docker 실행</text><text x="16" y="609" font-size="13" fill="#6353d8" font-weight="700">02  내 컴퓨터에서 실행하기</text><rect x="16" y="627" width="328" height="188" rx="16" fill="#eef4fc" stroke="#d8e3f1"/><g transform="translate(35 646)" fill="none" stroke="#6353d8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="2" width="30" height="12" rx="3"/><rect x="1" y="19" width="30" height="12" rx="3"/><path d="M6 8h2m4 0h12 M6 25h2m4 0h12"/></g><text x="80" y="669" font-size="20" fill="#26324b" font-weight="700">Nakama 컨테이너</text><text x="35" y="701" font-size="15" fill="#647086" font-weight="500">실제로 동작하는 로컬 게임 서버</text><text x="35" y="740" font-size="17" fill="#6353d8" font-weight="700">API :7350</text><text x="156" y="740" font-size="14" fill="#26324b" font-weight="500">로그인 · 점수 · 랭킹</text><text x="35" y="779" font-size="17" fill="#6353d8" font-weight="700">콘솔 :7351</text><text x="156" y="779" font-size="14" fill="#26324b" font-weight="500">사용자 · 기록 관리</text><path d="M180 820 L180 854" fill="none" stroke="#8792aa" stroke-width="2" marker-end="url(#arrow)"/><text x="198" y="842" font-size="13" fill="#647086" font-weight="500">읽기 / 저장</text><rect x="16" y="863" width="328" height="84" rx="16" fill="#fff" stroke="#dce2ed"/><g transform="translate(35 883)" fill="none" stroke="#267d6c" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="16" cy="6" rx="14" ry="5"/><path d="M2 6v20c0 7 28 7 28 0V6 M2 16c0 7 28 7 28 0"/></g><text x="80" y="897" font-size="19" fill="#26324b" font-weight="700">PostgreSQL 컨테이너</text><text x="80" y="925" font-size="14" fill="#647086" font-weight="500">계정과 점수를 관리하는 DB</text><path d="M180 950 L180 977" fill="none" stroke="#8792aa" stroke-width="2" marker-end="url(#arrow)"/><rect x="16" y="986" width="328" height="64" rx="16" fill="#e9f6f0" stroke="#bcded1"/><text x="35" y="1012" font-size="17" fill="#21634e" font-weight="700">데이터 볼륨 · 별도 저장 공간</text><text x="35" y="1036" font-size="14" fill="#21634e" font-weight="500">컨테이너를 정지해도 기록은 유지돼요</text><rect x="16" y="1068" width="328" height="60" rx="10" fill="#e9f6f0" stroke="#bcded1"/><text x="32" y="1093" font-size="16" fill="#21634e" font-weight="700">Nuxt 웹 화면 → Nakama SDK</text><text x="32" y="1116" font-size="14" fill="#21634e" font-weight="500">게임용 API로 실제 로그인 · 점수 저장</text></g></svg>