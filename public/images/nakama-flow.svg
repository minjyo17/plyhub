<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Nakama가 내 컴퓨터에서 실행되기까지</title><desc id="desc">빌드된 공식 Nakama 이미지에 우리 코드와 설정을 추가해 PlayHub 이미지를 만듭니다. Docker가 이 이미지를 컨테이너로 실행하면 로컬 Nakama 서버가 됩니다. 서버는 API 7350과 콘솔 7351을 제공하며 PostgreSQL과 통신합니다. 계정과 점수는 별도 데이터 볼륨에 저장되어 컨테이너를 정지해도 유지됩니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#8792aa" stroke-width="1.5"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="20" y="24" font-size="13" fill="#6353d8" font-weight="700">01  이미지 만들기</text><text x="980" y="24" font-size="13" fill="#26324b" font-weight="500"></text><rect x="20" y="44" width="290" height="174" rx="16" fill="#fff" stroke="#dce2ed"/><g transform="translate(40 63)" fill="none" stroke="#6353d8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="2" width="30" height="12" rx="3"/><rect x="1" y="19" width="30" height="12" rx="3"/><path d="M6 8h2m4 0h12 M6 25h2m4 0h12"/></g><text x="85" y="84" font-size="13" fill="#6353d8" font-weight="700">이미 준비된 서버</text><text x="40" y="125" font-size="21" fill="#26324b" font-weight="700">공식 Nakama 이미지</text><text x="40" y="160" font-size="15" fill="#26324b" font-weight="500">heroiclabs/nakama:3.37.0</text><text x="40" y="188" font-size="14" fill="#647086" font-weight="500">서버를 직접 컴파일하지 않아요</text><rect x="355" y="44" width="290" height="174" rx="16" fill="#fff" stroke="#dce2ed"/><g transform="translate(375 63)" fill="none" stroke="#6353d8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="m10 7-8 9 8 9 M22 7l8 9-8 9 M19 2l-6 28"/></g><text x="420" y="84" font-size="13" fill="#6353d8" font-weight="700">우리가 추가하는 부분</text><text x="375" y="125" font-size="21" fill="#26324b" font-weight="700">우리 코드 + 설정</text><text x="375" y="160" font-size="15" fill="#26324b" font-weight="500">리더보드 생성 · 서버 설정</text><text x="375" y="188" font-size="14" fill="#647086" font-weight="500">TypeScript → JavaScript 빌드</text><rect x="690" y="44" width="290" height="174" rx="16" fill="#f5f2ff" stroke="#dcd5f5"/><g transform="translate(710 63)" fill="none" stroke="#6353d8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M2 8 16 1 30 8 16 15Z M2 8v16l14 7 14-7V8 M16 15v16"/></g><text x="755" y="84" font-size="13" fill="#6353d8" font-weight="700">실행할 파일을 담은 패키지</text><text x="710" y="125" font-size="21" fill="#26324b" font-weight="700">PlayHub 이미지</text><text x="710" y="160" font-size="15" fill="#26324b" font-weight="500">Nakama + 우리 코드 + 설정</text><text x="710" y="188" font-size="14" fill="#647086" font-weight="500">Dockerfile로 하나로 묶어요</text><text x="324" y="140" font-size="26" fill="#8792aa" font-weight="500">+</text><path d="M651 131 L681 131" fill="none" stroke="#8792aa" stroke-width="2" marker-end="url(#arrow)"/><path d="M835 220 L835 287" fill="none" stroke="#8792aa" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="254" font-size="14" fill="#6353d8" font-weight="700">Docker가 실행</text><text x="20" y="267" font-size="13" fill="#6353d8" font-weight="700">02  내 컴퓨터에서 실행하기</text><rect x="20" y="287" width="960" height="281" rx="20" fill="#eef4fc" stroke="#d8e3f1"/><text x="44" y="316" font-size="13" fill="#6353d8" font-weight="700">DOCKER · 실행 중인 컨테이너</text><rect x="44" y="337" width="470" height="206" rx="16" fill="#fff" stroke="#dce2ed"/><g transform="translate(65 355)" fill="none" stroke="#6353d8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="2" width="30" height="12" rx="3"/><rect x="1" y="19" width="30" height="12" rx="3"/><path d="M6 8h2m4 0h12 M6 25h2m4 0h12"/></g><text x="110" y="379" font-size="22" fill="#26324b" font-weight="700">Nakama 컨테이너</text><text x="65" y="412" font-size="16" fill="#647086" font-weight="500">실제로 동작하는 로컬 게임 서버</text><rect x="65" y="435" width="200" height="85" rx="10" fill="#f5f2ff" stroke="#e6dff8"/><text x="80" y="459" font-size="13" fill="#6353d8" font-weight="700">게임용 API</text><text x="80" y="484" font-size="16" fill="#26324b" font-weight="650">localhost:7350</text><text x="80" y="505" font-size="13" fill="#647086" font-weight="500">로그인 · 점수 · 랭킹</text><rect x="279" y="435" width="214" height="85" rx="10" fill="#f5f2ff" stroke="#e6dff8"/><text x="294" y="459" font-size="13" fill="#6353d8" font-weight="700">관리 콘솔</text><text x="294" y="484" font-size="16" fill="#26324b" font-weight="650">localhost:7351</text><text x="294" y="505" font-size="13" fill="#647086" font-weight="500">사용자 · 기록 관리 화면</text><path d="M525 415 L622 415" fill="none" stroke="#8792aa" stroke-width="2" marker-end="url(#arrow)"/><text x="533" y="397" font-size="13" fill="#647086" font-weight="500">읽기 / 저장</text><rect x="635" y="337" width="321" height="112" rx="16" fill="#fff" stroke="#dce2ed"/><g transform="translate(654 355)" fill="none" stroke="#267d6c" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="16" cy="6" rx="14" ry="5"/><path d="M2 6v20c0 7 28 7 28 0V6 M2 16c0 7 28 7 28 0"/></g><text x="699" y="379" font-size="19" fill="#26324b" font-weight="700">PostgreSQL 컨테이너</text><text x="655" y="414" font-size="15" fill="#647086" font-weight="500">계정과 점수를 관리하는 DB</text><path d="M795 450 L795 475" fill="none" stroke="#8792aa" stroke-width="2" marker-end="url(#arrow)"/><rect x="635" y="483" width="321" height="60" rx="10" fill="#e9f6f0" stroke="#bcded1"/><text x="654" y="508" font-size="16" fill="#21634e" font-weight="700">데이터 볼륨 · 별도 저장 공간</text><text x="654" y="530" font-size="13" fill="#21634e" font-weight="500">컨테이너를 정지해도 기록은 유지돼요</text><rect x="20" y="588" width="960" height="48" rx="10" fill="#e9f6f0" stroke="#bcded1"/><text x="40" y="618" font-size="14" fill="#21634e" font-weight="700">연결 완료</text><text x="130" y="618" font-size="15" fill="#21634e" font-weight="500">Nuxt 웹 화면 → Nakama SDK → 게임용 API · 실제 로그인과 점수 저장</text></g></svg>