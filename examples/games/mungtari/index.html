<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>멍타리 대전</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="app">
    <div class="stage">
      <canvas id="game" aria-label="멍타리 대전 게임 화면"></canvas>

      <div id="menu" class="overlay">
        <div class="card">
          <h1>멍타리 대전</h1>
          <p class="lead">울타리 너머 옆집 보리에게 뼈다귀를 던져요.<br>바람을 읽고 힘을 조절해서 먼저 HP를 0으로 만들면 이겨요.</p>
          <ul class="how">
            <li><b>조준</b> 마우스를 움직여요 (휴대폰은 누른 채 끌기)</li>
            <li><b>던지기</b> 꾸욱 누르면 힘이 차고, 떼면 날아가요</li>
            <li><b>주의</b> 게이지를 끝까지 채우면 너무 세서 맵 밖으로!</li>
            <li><b>아이템</b> 던지기 전에 아래 칸을 눌러 장착 (한 턴에 1개)</li>
          </ul>
          <p class="pick">보리의 실력을 골라 주세요</p>
          <div class="levels">
            <button data-level="easy">쉬움</button>
            <button data-level="normal" class="primary">보통</button>
            <button data-level="hard">어려움</button>
          </div>
          <div class="online">
            <p class="pick">친구와 1:1 대전</p>
            <div class="online-row">
              <button id="room-create" type="button" class="primary">방 만들기</button>
              <!-- 포털 iframe은 sandbox(allow-forms 없음)라 form 제출이 막힌다. 클릭·Enter로 처리한다 -->
              <div class="join">
                <input id="room-code" maxlength="6" placeholder="초대코드" autocomplete="off" spellcheck="false" aria-label="초대코드 6자리">
                <button id="room-join" type="button">참여</button>
              </div>
            </div>
            <p id="online-note" class="online-note" role="status"></p>
          </div>
        </div>
      </div>

      <div id="lobby" class="overlay" hidden>
        <div class="card lobby-card">
          <p id="lobby-title" class="pick"></p>
          <div id="lobby-code-row" class="code-row">
            <span id="lobby-code" class="code"></span>
            <button id="lobby-copy" type="button">코드 복사</button>
          </div>
          <div class="dog-pick" role="radiogroup" aria-label="내 강아지">
            <button type="button" class="dog-btn" data-side="left" role="radio"><img alt=""><span>콩이</span></button>
            <button type="button" class="dog-btn" data-side="right" role="radio"><img alt=""><span>보리</span></button>
          </div>
          <label class="name-field">내 강아지 이름
            <input id="my-name" maxlength="6" autocomplete="off" spellcheck="false">
          </label>
          <p id="friend-line" class="friend-line"></p>
          <p id="lobby-note" class="result-sub"></p>
          <div class="levels">
            <button id="lobby-start" type="button" class="primary">시작하기</button>
            <button id="lobby-leave" type="button">나가기</button>
          </div>
        </div>
      </div>

      <div id="result" class="overlay" hidden>
        <div class="card">
          <p id="result-title" class="result-title"></p>
          <p id="result-sub" class="result-sub"></p>
          <div class="hp-summary">
            <div><span id="result-left-name">콩이</span><b id="result-left">0</b></div>
            <div><span id="result-right-name">보리</span><b id="result-right">0</b></div>
          </div>
          <p id="result-save" class="result-save" role="status"></p>
          <div class="levels">
            <button id="again" class="primary">다시 하기</button>
            <button id="to-menu">난이도 바꾸기</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="bar">
      <div class="power">
        <span class="label">힘</span>
        <div class="gauge-wrap">
          <div class="gauge"><i id="gauge-fill"></i><em id="gauge-last" title="지난번에 던진 힘"></em></div>
          <small id="gauge-last-label" class="gauge-last-label">지난번</small>
        </div>
      </div>
      <div id="items" class="items" aria-label="아이템 칸"></div>
      <button id="sound" class="sound" type="button">소리 켜짐</button>
    </footer>
    <p id="hint" class="hint">꾸욱 눌러서 힘을 모으고, 떼면 던져요</p>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
